name: Download daily precipitation data

on:
  schedule:
    - cron: "15 20 * * *" # set to run every day at 12:15 p.m. PST
  workflow_dispatch:

concurrency:
  # Every scraper commits and pushes to the same branch, so run them one at a
  # time. Queue rather than cancel so no scheduled run is dropped.
  group: scraper-commit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pipenv'
      - name: Install pipenv
        run: python -m pip install --no-cache-dir pipenv
      - name: Install dependencies
        run: pipenv sync
      - name: Get precip data
        run: make precipitationdata
      # - name: Run total scraper
      #   run: pipenv run jupyter execute precipitation/precipitation.ipynb  
      # - name: Run daily scraper
      #   run: pipenv run jupyter execute precipitation/daily-precipitation.ipynb        
      - name: Add and commit
        id: add_commit
        uses: EndBug/add-and-commit@v9
        with:
          committer_name: Automated
          committer_email: actions@users.noreply.github.com
          message: "Latest precipitation data"
      - name: Push
        run: git push
