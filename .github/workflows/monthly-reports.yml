name: Download & process urban water data

on:
  schedule:
  - cron: 35 7 * * 5 # every Friday around 7:35 p.m. Pacific
  workflow_dispatch:

concurrency:
  # Every scraper commits and pushes to the same branch, so run them one at a
  # time. Queue rather than cancel so no scheduled run is dropped.
  group: scraper-commit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  get:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pipenv'
      - name: Install pipenv
        run: python -m pip install --no-cache-dir pipenv
      - name: Install dependencies
        run: pipenv sync
      - name: Run scraper
        run: pipenv run python urban-water-use/scrape.py
      - name: Process urban water use data
        run: make urbanwaterusedata
      - name: Add and commit 
        uses: EndBug/add-and-commit@v9
        with:
          message: 'New files data added'
