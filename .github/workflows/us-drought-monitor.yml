name: Scrape U.S. Drought Monitor

on:
  schedule:
    - cron: "30 13 * * 4" # set to run every Thursday at 6:30 a.m. PST (USDM publishes new data Thursdays at 5:30 a.m.)
  workflow_dispatch:

concurrency:
  # Every scraper commits and pushes to the same branch, so run them one at a
  # time. Queue rather than cancel so no scheduled run is dropped.
  group: scraper-commit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pipenv'
      - name: Install pipenv
        run: python -m pip install --no-cache-dir pipenv
      - name: Install dependencies
        run: pipenv sync
      - name: Get US Drought Monitor data
        run: make droughtmonitordata
      # - name: Run total scraper
      #   run: pipenv run jupyter execute drought-monitor/drought-monitor.ipynb  
      - name: Add and commit
        id: add_commit
        uses: EndBug/add-and-commit@v9
        with:
          committer_name: Automated
          committer_email: actions@users.noreply.github.com
          message: "Latest U.S. Drought Monitor data"
      - name: Push
        run: git push
